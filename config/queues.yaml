# ============================================================
# キュー設定ファイル（queues.yaml）
# ============================================================
#
# 概要:
#   Worker が監視するキューの設定を定義します。
#   libs/shared/config.py から読み込まれ、Worker の動作を制御します。
#
# 設計上の決定:
#   - YAML 形式を採用（可読性が高く、コメントが書ける）
#   - キューごとに個別の設定が可能（将来の拡張に対応）
#   - デフォルト値を設定し、最小限の記述で動作可能
#
# 設定変更後:
#   Worker コンテナの再起動が必要です
#   docker compose restart worker
#
# ============================================================

# ============================================================
# Worker 全体設定
# ============================================================
worker:
  # 最大並行処理数
  # ----------------------------------------
  # Worker が同時に処理できるメッセージの最大数。
  # asyncio.Semaphore で制御されます。
  #
  # 設定の目安:
  # - CPU バウンドな処理: CPU コア数と同程度
  # - I/O バウンドな処理（このチュートリアル）: より大きな値も可
  # - メモリ使用量も考慮して設定
  #
  # 注意: 大きすぎると外部サービスへの負荷が増加します
  max_concurrent: 5

# ============================================================
# キュー設定リスト
# ============================================================
# 複数のキューを監視する場合は、リストに追加します。
# 例:
#   queues:
#     - name: task-queue
#       ...
#     - name: priority-queue
#       ...
#
queues:
  # ============================================================
  # メインキュー: task-queue
  # ============================================================
  # API から投入されたタスク/ファイル処理メッセージを受け取ります。
  #
  - name: task-queue
    # ポーリング間隔（秒）
    # ----------------------------------------
    # キューが空の時の基本待機時間。
    # メッセージがない場合、この間隔でポーリングを繰り返します。
    #
    # 小さい値: 応答性向上、API コール増加
    # 大きい値: API コール削減、応答性低下
    polling_interval: 1.0

    # 最大バックオフ（秒）
    # ----------------------------------------
    # Exponential Backoff の上限値。
    # キューが空の状態が続くと、待機時間が徐々に増加しますが、
    # この値を超えることはありません。
    #
    # Exponential Backoff の動作:
    # 1回目: 1秒 → 2回目: 2秒 → 3回目: 4秒 → ... → 上限: 30秒
    # （実際には Jitter が加わりランダム化されます）
    backoff_max: 30.0

    # 最大リトライ回数
    # ----------------------------------------
    # メッセージ処理が失敗した場合のリトライ上限。
    # この回数を超えると、メッセージは DLQ（Dead Letter Queue）に移動されます。
    #
    # Azure Queue Storage の dequeue_count で判定:
    # dequeue_count > max_retries の場合、DLQ へ移動
    #
    # 設定の目安:
    # - 一時的なエラー（ネットワーク障害）: 3-5 回
    # - 永続的なエラー（データ不整合）: 早めに DLQ へ移動
    max_retries: 5

    # DLQ メッセージ保持期間（日）
    # ----------------------------------------
    # Dead Letter Queue に移動されたメッセージの保持期間。
    # この期間を過ぎると、メッセージは自動的に削除されます。
    #
    # DLQ の用途:
    # - 失敗したメッセージの調査・分析
    # - 問題解決後の再処理
    # - 監視・アラートのトリガー
    #
    # 設定の目安:
    # - 本番環境: 7-30 日（調査に十分な期間）
    # - 開発環境: 1-3 日（短めでOK）
    dlq_ttl_days: 7
