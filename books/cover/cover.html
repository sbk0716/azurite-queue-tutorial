<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Python + Azurite で学ぶ 実践キューイングシステム入門</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }

        .cover {
            width: 500px;
            height: 700px;
            background: linear-gradient(170deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        /* グリッドパターン背景 */
        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index: 1;
        }

        /* 上部のグロー */
        .glow-top {
            position: absolute;
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(0, 212, 255, 0.06) 0%, transparent 60%);
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* メインコンテンツ */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 60px 50px;
        }

        /* タイトルエリア */
        .title-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tech-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 45px;
            width: fit-content;
        }

        .badge-dot {
            width: 5px;
            height: 5px;
            background: #00d4ff;
            border-radius: 50%;
        }

        .prefix {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 14px;
            letter-spacing: 3px;
        }

        .main-title {
            font-size: 44px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 28px;
            letter-spacing: -1px;
        }

        .main-title .highlight {
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        /* 3サービス表示 */
        .services {
            display: flex;
            gap: 12px;
            margin-bottom: 45px;
        }

        .service-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 3px;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .author {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* フッターエリア */
        .footer-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tech-stack {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tech-icon {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 3px;
            font-weight: 500;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
        }

        .version {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: -1px;
        }
    </style>
</head>
<body>
    <div class="cover">
        <!-- 背景エフェクト -->
        <div class="grid-pattern"></div>
        <div class="glow-top"></div>

        <!-- コンテンツ -->
        <div class="content">
            <div class="title-area">
                <div class="tech-badge">
                    <span class="badge-dot"></span>
                    Azure Storage × Azurite
                </div>

                <p class="prefix">Python で学ぶ</p>

                <h1 class="main-title">
                    実践<br>
                    <span class="highlight">キューイング</span><br>
                    システム入門
                </h1>

                <div class="subtitle">
                    非同期処理の設計と実装
                </div>

                <div class="services">
                    <span class="service-tag">Queue</span>
                    <span class="service-tag">Blob</span>
                    <span class="service-tag">Table</span>
                </div>

                <p class="author">by shibatoki</p>
            </div>

            <div class="footer-area">
                <div class="tech-stack">
                    <div class="tech-icon">FastAPI</div>
                    <div class="tech-icon">async/await</div>
                    <div class="tech-icon">DLQ</div>
                    <div class="tech-icon">Docker</div>
                </div>
                <div class="version">2026</div>
            </div>
        </div>
    </div>
</body>
</html>
